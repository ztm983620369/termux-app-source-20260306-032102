plugins {
    id 'com.android.library'
}

android {
    namespace 'top.zibin.luban'
    compileSdkVersion rootProject.properties.compileSdkVersion.toInteger()

    defaultConfig {
        minSdkVersion rootProject.properties.minSdkVersion.toInteger()
        targetSdkVersion rootProject.properties.targetSdkVersion.toInteger()
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest-tindroid.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        buildConfig true
    }
}
