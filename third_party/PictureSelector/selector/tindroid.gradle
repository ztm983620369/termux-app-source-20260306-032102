plugins {
    id 'com.android.library'
}

android {
    namespace 'com.luck.picture.lib'
    compileSdkVersion rootProject.properties.compileSdkVersion.toInteger()

    defaultConfig {
        minSdkVersion rootProject.properties.minSdkVersion.toInteger()
        targetSdkVersion rootProject.properties.targetSdkVersion.toInteger()

        vectorDrawables.useSupportLibrary = true
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest-tindroid.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    api 'androidx.annotation:annotation:1.9.0'
    api 'androidx.core:core:1.13.1'
    api 'androidx.appcompat:appcompat:1.3.1'
    api 'androidx.recyclerview:recyclerview:1.2.1'
    api 'androidx.activity:activity:1.3.1'
    api 'androidx.fragment:fragment:1.3.1'
    api 'androidx.exifinterface:exifinterface:1.3.3'
    api 'androidx.viewpager2:viewpager2:1.0.0'
    api 'androidx.constraintlayout:constraintlayout:2.1.4'
}
