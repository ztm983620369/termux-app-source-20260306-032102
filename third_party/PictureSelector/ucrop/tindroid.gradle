plugins {
    id 'com.android.library'
}

android {
    namespace 'com.yalantis.ucrop'
    compileSdkVersion rootProject.properties.compileSdkVersion.toInteger()

    defaultConfig {
        minSdkVersion rootProject.properties.minSdkVersion.toInteger()
        targetSdkVersion rootProject.properties.targetSdkVersion.toInteger()

        vectorDrawables.useSupportLibrary = true
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest-tindroid.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }

    resourcePrefix 'ucrop_'

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.3'
    implementation 'androidx.transition:transition:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.code.gson:gson:2.8.6'
}
