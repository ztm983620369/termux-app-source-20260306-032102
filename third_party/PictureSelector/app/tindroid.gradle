plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.luck.pictureselector'
    compileSdkVersion rootProject.properties.compileSdkVersion.toInteger()

    defaultConfig {
        minSdkVersion rootProject.properties.minSdkVersion.toInteger()
        targetSdkVersion rootProject.properties.targetSdkVersion.toInteger()
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest-tindroid.xml'
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':pictureselector-selector')
    implementation project(':pictureselector-compress')
    implementation project(':pictureselector-ucrop')
    implementation project(':pictureselector-camerax')
    implementation project(':pictureselector-ijkplayer-java')

    implementation 'androidx.navigation:navigation-fragment-ktx:2.3.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.5'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.exoplayer:exoplayer:2.18.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'io.coil-kt:coil:2.1.0'
    implementation 'io.coil-kt:coil-gif:2.1.0'
    implementation 'io.coil-kt:coil-video:2.1.0'
}
